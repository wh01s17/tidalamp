[project]
name = "tidalamp"
version = "0.7.0"
description = "Linux terminal TIDAL client with hi-res playback and a retro TUI (requires system mpv)"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
keywords = ["tidal", "music", "player", "tui", "terminal", "hi-res", "flac", "mpv", "mpris"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console :: Curses",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: English",
    "Natural Language :: Spanish",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Sound/Audio :: Players",
]
dependencies = [
    "tidalapi>=0.8.11",
    "textual>=0.80",
    "typer>=0.12",
    "dbus-fast>=5.0.22",
    "requests>=2.31",
]

[project.urls]
Homepage = "https://github.com/wh01s17/tidalamp"
Repository = "https://github.com/wh01s17/tidalamp"
Issues = "https://github.com/wh01s17/tidalamp/issues"
Changelog = "https://github.com/wh01s17/tidalamp/releases"

[project.optional-dependencies]
# Album art needs a decoder. Without it the cover is simply not drawn, so it
# stays out of the hard dependencies: `pip install "tidalamp[art]"`.
art = ["pillow>=10"]
dev = ["pytest>=8", "pytest-cov>=5", "pillow>=10", "ruff>=0.14", "mypy>=1.11"]

[project.scripts]
tidalamp = "tidalamp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tidalamp"]

[tool.hatch.build.targets.sdist]
include = [
    "tidalamp/",
    "tests/",
    "packaging/",
    "README.md",
    "publish.md",
    "LICENSE",
    "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 90
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "C4", "PIE", "RUF"]
ignore = [
    # Spanish is the source language for the interface, and some maintainer
    # documentation remains Spanish. « » — ¿ are not ambiguous there.
    "RUF001",
    "RUF002",
    "RUF003",
    # Textual's own API is class attributes holding lists (BINDINGS, CSS…).
    "RUF012",
    # NotLoggedIn, StreamUnavailable, MpvNotFound: these read as sentences at
    # the call site, which is where they are caught. An Error suffix would buy
    # a convention and cost the reading.
    "N818",
]

[tool.ruff.lint.per-file-ignores]
# dbus-fast reads the D-Bus signature out of the annotation, so it has to stay
# a string literal: "b", "a{sv}", "ao". Un-quoting them breaks the service at
# import time, and they are not forward references to anything.
"tidalamp/mpris.py" = ["UP037", "F722"]

[tool.mypy]
python_version = "3.11"
files = ["tidalamp"]
# tidalapi and textual ship partial or no stubs; we check our own code, not
# theirs.
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true

# dbus-fast reads a D-Bus signature out of each annotation: "b", "a{sv}", "ao".
# They are not Python types and no type checker can read them as such, so this
# module is checked by its own contract tests instead — see tests/test_mpris.py,
# which exercises every method and property over a real bus.
[[tool.mypy.overrides]]
module = "tidalamp.mpris"
ignore_errors = true

[tool.coverage.run]
source = ["tidalamp"]
branch = true

[tool.coverage.report]
# A floor, not a target. It exists so a change that guts the tests fails the
# build instead of passing quietly.
fail_under = 70
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
