[project]
name = "tidalamp"
version = "0.1.0"
description = "Cliente TIDAL para terminal con interfaz estilo Winamp"
requires-python = ">=3.11"
dependencies = [
    "tidalapi>=0.8.11",
    "textual>=0.80",
    "typer>=0.12",
    "dbus-next>=0.2.3",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
tidalamp = "tidalamp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tidalamp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
