name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # The MPRIS integration test spins up its own session bus; without the
      # daemon it skips instead of failing, and we would rather it run.
      - name: Install dbus-daemon
        run: sudo apt-get update && sudo apt-get install -y dbus

      - name: Install the package
        run: python -m pip install -e ".[dev]"

      - name: Run the suite
        run: python -m pytest -q --cov

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install the package
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Format
        run: ruff format --check .

      - name: Types
        run: mypy
