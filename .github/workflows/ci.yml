name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
        # Windows at the two ends of the range: the named pipe, AppData, the
        # stand-in backends. See windows.md, phase F2.
        include:
          - os: windows-latest
            python: "3.11"
          - os: windows-latest
            python: "3.14"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # The MPRIS integration test spins up its own session bus; without the
      # daemon it skips instead of failing, and we would rather it run.
      - name: Install dbus-daemon
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y dbus

      - name: Install the package
        run: python -m pip install -e ".[dev]"

      - name: Run the suite
        run: python -m pytest -q --cov

  # What a user actually types: no extras, so no Pillow and no cava. A hard
  # dependency on an optional one would break the documented install without
  # any other job noticing — the covers went missing on a fresh clone exactly
  # that way. The skips in the suite are the signal, not a problem.
  bare:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows too: that is where one `import dbus_fast` too many would
        # break the install.
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install without extras
        run: python -m pip install -e .

      - name: Import every module
        run: python tools/import_all.py

      - name: The console script runs
        run: tidalamp --help

      - name: Run the suite
        run: |
          python -m pip install pytest
          python -m pytest -q -p no:cacheprovider

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install the package
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Format
        run: ruff format --check .

      # Each pass drops the other system's branches and checks its own;
      # without the second, the Windows code is never checked here.
      - name: Types (Linux)
        run: mypy --platform linux

      - name: Types (Windows)
        run: mypy --platform win32
